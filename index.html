<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vibe Prompts — генератор промтов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #12121a 100%);
            color: #eef2ff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding: 24px 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .title-section h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #a5f3ff, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .title-section p {
            color: #8b8ca3;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .lang-switch {
            background: rgba(30, 30, 40, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 4px;
            display: flex;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lang-option {
            padding: 8px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
            color: #9ca3af;
            border: none;
        }

        .lang-option.active {
            background: #7c3aed;
            color: white;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.4);
        }

        .card {
            background: rgba(30, 30, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: #8b8ca3;
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            background: #1e1e2a;
            border: 1px solid #2a2a35;
            border-radius: 20px;
            padding: 16px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
        }

        .option-group {
            flex: 1;
            min-width: 130px;
        }

        .option-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            color: #a5b4fc;
            margin-bottom: 10px;
            display: block;
        }

        .option-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .opt-btn {
            background: #1e1e2a;
            border: 1px solid #2a2a35;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
        }

        .opt-btn.active {
            background: #7c3aed;
            border-color: #7c3aed;
            color: white;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #1e1e2a;
            border: 1px solid #2a2a35;
            border-radius: 40px;
            padding: 10px 16px;
            font-size: 0.85rem;
            color: #cbd5e1;
            cursor: pointer;
            flex: 1;
            text-align: center;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #2a2a35;
        }

        .generate-btn {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border: none;
            border-radius: 44px;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .generate-btn:active {
            transform: scale(0.98);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            transform: none;
        }

        .result-card {
            background: rgba(30, 30, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            color: #a5b4fc;
        }

        .result-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.5);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #c4b5fd;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.96);
        }

        .prompt-box {
            background: #0f0f17;
            border-radius: 20px;
            padding: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            border-left: 3px solid #7c3aed;
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        .history-card {
            background: rgba(30, 30, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .history-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            background: #0f0f17;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-left: 2px solid #7c3aed;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: #1a1a24;
        }

        .history-prompt {
            color: #cbd5e1;
            word-break: break-word;
            font-size: 0.8rem;
        }

        .history-date {
            font-size: 0.65rem;
            color: #6b6b8a;
            margin-top: 6px;
        }

        .empty-history {
            text-align: center;
            color: #6b6b8a;
            padding: 20px;
        }

        .error {
            color: #f87171;
            font-size: 0.8rem;
            margin-top: 12px;
            text-align: center;
        }

        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #4b4b63;
            margin-top: 32px;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #a855f7;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title-section">
            <h1>Vibe Prompts</h1>
            <p id="subtitle">Напиши идею — получи идеальный промт</p>
        </div>
        <div class="lang-switch">
            <button data-lang="ru" class="lang-option active">Рус</button>
            <button data-lang="uz" class="lang-option">Uz</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title" id="inputLabel">✏️ Что генерируем?</div>
        <textarea id="userInput" rows="3" placeholder="Например: кот-самурай на закате..."></textarea>
    </div>

    <div class="action-buttons">
        <button id="exampleBtn" class="action-btn">📋 Пример</button>
        <button id="randomBtn" class="action-btn">🎲 Случайная идея</button>
    </div>

    <div class="options-grid">
        <div class="option-group">
            <div class="option-label" id="langPromptLabel">📝 Язык промта</div>
            <div class="option-buttons" id="promptLangOptions">
                <button data-plang="ru" class="opt-btn">Русский</button>
                <button data-plang="en" class="opt-btn active">English</button>
                <button data-plang="uz" class="opt-btn">O'zbekcha</button>
            </div>
        </div>
        <div class="option-group">
            <div class="option-label" id="lengthLabel">📏 Длина</div>
            <div class="option-buttons" id="lengthOptions">
                <button data-length="short" class="opt-btn">Короткий</button>
                <button data-length="detailed" class="opt-btn active">Подробный</button>
            </div>
        </div>
        <div class="option-group">
            <div class="option-label" id="styleLabel">🎨 Стиль</div>
            <div class="option-buttons" id="styleOptions">
                <button data-style="realistic" class="opt-btn">Реализм</button>
                <button data-style="anime" class="opt-btn">Аниме</button>
                <button data-style="cyberpunk" class="opt-btn">Киберпанк</button>
                <button data-style="retro" class="opt-btn">Ретро</button>
                <button data-style="fantasy" class="opt-btn">Фэнтези</button>
            </div>
        </div>
    </div>

    <button id="generateBtn" class="generate-btn">✨ Сгенерировать промт</button>

    <div id="resultCard" class="result-card">
        <div class="result-header">
            <span class="result-label" id="resultLabel">🎯 Промт</span>
            <div class="result-actions">
                <button id="copyBtn" class="icon-btn">📋 Копировать</button>
                <button id="saveBtn" class="icon-btn">⭐ Сохранить</button>
            </div>
        </div>
        <div id="promptOutput" class="prompt-box"></div>
        <div id="errorMsg" class="error"></div>
    </div>

    <div id="historyCard" class="history-card">
        <div class="history-title">
            <span class="card-title" id="historyLabel">📜 История</span>
            <button id="clearHistoryBtn" class="icon-btn" style="background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.5); color: #f87171;">🗑️ Очистить</button>
        </div>
        <div id="historyList" class="history-list"></div>
    </div>

    <div class="footer">
        🔥 Nano Banana 2, Midjourney, DALL·E, Stable Diffusion
    </div>
</div>

<script>
    const GROQ_API_KEY = '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';
    const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';

    // Элементы
    const userInput = document.getElementById('userInput');
    const generateBtn = document.getElementById('generateBtn');
    const resultCard = document.getElementById('resultCard');
    const promptOutput = document.getElementById('promptOutput');
    const copyBtn = document.getElementById('copyBtn');
    const saveBtn = document.getElementById('saveBtn');
    const errorMsg = document.getElementById('errorMsg');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const exampleBtn = document.getElementById('exampleBtn');
    const randomBtn = document.getElementById('randomBtn');

    // Состояния
    let selectedLength = 'detailed';
    let selectedStyle = 'realistic';
    let selectedPromptLang = 'en';
    let selectedInterfaceLang = 'ru';
    let currentPrompt = '';
    let history = [];

    // Тексты (добавлены exampleBtn и randomBtn)
    const translations = {
        ru: {
            subtitle: 'Напиши идею — получи идеальный промт',
            inputLabel: '✏️ Что генерируем?',
            inputPlaceholder: 'Например: кот-самурай на закате, девушка в киберпанк-городе...',
            langPromptLabel: '📝 Язык промта',
            lengthLabel: '📏 Длина',
            styleLabel: '🎨 Стиль',
            generateBtn: '✨ Сгенерировать промт',
            resultLabel: '🎯 Промт',
            historyLabel: '📜 История',
            clearBtn: '🗑️ Очистить',
            emptyHistory: '✨ Здесь будут сохранённые промты',
            copySuccess: '✅ Скопировано!',
            saveSuccess: '⭐ Сохранено!',
            noPromptToCopy: '❌ Нечего копировать',
            noPromptToSave: '❌ Сначала сгенерируйте промт',
            errorEmptyQuery: '✏️ Напишите запрос',
            exampleBtn: '📋 Пример',
            randomBtn: '🎲 Случайная идея'
        },
        uz: {
            subtitle: 'G\'oyani yozing — mukammal prompt oling',
            inputLabel: '✏️ Nima yaratamiz?',
            inputPlaceholder: 'Masalan: quyosh botishida samuray mushuk, kiberpank shahridagi qiz...',
            langPromptLabel: '📝 Prompt tili',
            lengthLabel: '📏 Uzunlik',
            styleLabel: '🎨 Uslub',
            generateBtn: '✨ Prompt yaratish',
            resultLabel: '🎯 Prompt',
            historyLabel: '📜 Tarix',
            clearBtn: '🗑️ Tozalash',
            emptyHistory: '✨ Saqlangan promptlar shu yerda',
            copySuccess: '✅ Nusxalandi!',
            saveSuccess: '⭐ Saqlandi!',
            noPromptToCopy: '❌ Nusxalash uchun hech narsa yo\'q',
            noPromptToSave: '❌ Avval prompt yarating',
            errorEmptyQuery: '✏️ Iltimos, so\'rov yozing',
            exampleBtn: '📋 Misol',
            randomBtn: '🎲 Tasodifiy g\'oya'
        }
    };

    function updateUILanguage() {
        const t = translations[selectedInterfaceLang];
        document.getElementById('subtitle').textContent = t.subtitle;
        document.getElementById('inputLabel').textContent = t.inputLabel;
        document.getElementById('langPromptLabel').textContent = t.langPromptLabel;
        document.getElementById('lengthLabel').textContent = t.lengthLabel;
        document.getElementById('styleLabel').textContent = t.styleLabel;
        document.getElementById('generateBtn').textContent = t.generateBtn;
        document.getElementById('resultLabel').textContent = t.resultLabel;
        document.getElementById('historyLabel').textContent = t.historyLabel;
        document.getElementById('clearHistoryBtn').textContent = t.clearBtn;
        userInput.placeholder = t.inputPlaceholder;
        
        // Перевод кнопок Пример и Случайная идея
        exampleBtn.textContent = t.exampleBtn;
        randomBtn.textContent = t.randomBtn;
        
        // Обновляем кнопки длины
        const lengthBtns = document.querySelectorAll('#lengthOptions .opt-btn');
        if (lengthBtns.length >= 2) {
            lengthBtns[0].textContent = selectedInterfaceLang === 'ru' ? 'Короткий' : 'Qisqa';
            lengthBtns[1].textContent = selectedInterfaceLang === 'ru' ? 'Подробный' : 'Batafsil';
        }
        
        // Обновляем кнопки стиля
        const styleNames = {
            ru: { realistic: 'Реализм', anime: 'Аниме', cyberpunk: 'Киберпанк', retro: 'Ретро', fantasy: 'Фэнтези' },
            uz: { realistic: 'Realizm', anime: 'Anime', cyberpunk: 'Kiberpank', retro: 'Retro', fantasy: 'Fantaziya' }
        };
        const styleBtns = document.querySelectorAll('#styleOptions .opt-btn');
        const styleValues = ['realistic', 'anime', 'cyberpunk', 'retro', 'fantasy'];
        styleBtns.forEach((btn, idx) => {
            if (styleValues[idx]) {
                btn.textContent = styleNames[selectedInterfaceLang][styleValues[idx]];
            }
        });
        
        // Обновляем кнопки языка промта
        const promptLangNames = {
            ru: { ru: 'Русский', en: 'English', uz: 'O\'zbekcha' },
            uz: { ru: 'Ruscha', en: 'English', uz: 'O\'zbekcha' }
        };
        const promptLangBtns = document.querySelectorAll('#promptLangOptions .opt-btn');
        const promptLangValues = ['ru', 'en', 'uz'];
        promptLangBtns.forEach((btn, idx) => {
            if (promptLangValues[idx]) {
                btn.textContent = promptLangNames[selectedInterfaceLang][promptLangValues[idx]];
            }
        });
        
        renderHistory();
    }

    // Переключатель языка интерфейса
    document.querySelectorAll('.lang-option').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.lang-option').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedInterfaceLang = btn.dataset.lang;
            updateUILanguage();
        });
    });

    // Язык промта
    document.querySelectorAll('#promptLangOptions .opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#promptLangOptions .opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedPromptLang = btn.dataset.plang;
        });
    });

    // Длина
    document.querySelectorAll('#lengthOptions .opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#lengthOptions .opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedLength = btn.dataset.length;
        });
    });

    // Стиль
    document.querySelectorAll('#styleOptions .opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#styleOptions .opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedStyle = btn.dataset.style;
        });
    });

    // Примеры
    const examples = ["кот-самурай на закате", "девушка в киберпанк-городе", "старый маг в лесу", "дракон над замком"];
    exampleBtn.addEventListener('click', () => {
        userInput.value = examples[Math.floor(Math.random() * examples.length)];
    });

    const randomIdeas = ["единорог в космосе", "подводный город", "танцующий скелет 80-х", "часовщик-андроид"];
    randomBtn.addEventListener('click', () => {
        userInput.value = randomIdeas[Math.floor(Math.random() * randomIdeas.length)];
    });

    function buildSystemPrompt(length, style, promptLang) {
        const lengthDesc = {
            short: { ru: 'Короткий промт: 20-40 слов, только суть.', en: 'Short prompt: 20-40 words, just the essence.', uz: 'Qisqa prompt: 20-40 so\'z, faqat mazmun.' },
            detailed: { ru: 'Подробный промт: 50-100 слов, много деталей.', en: 'Detailed prompt: 50-100 words, many details.', uz: 'Batafsil prompt: 50-100 so\'z, ko\'plab detallar.' }
        };
        const styleMap = {
            realistic: { ru: 'реалистичный, фотореалистичный', en: 'realistic, photorealistic', uz: 'realistik, fotorealistik' },
            anime: { ru: 'в стиле аниме, яркие цвета', en: 'anime style, vibrant colors', uz: 'anime uslubida, yorqin ranglar' },
            cyberpunk: { ru: 'киберпанк, неоновые огни', en: 'cyberpunk, neon lights', uz: 'kiberpank, neon chiroqlar' },
            retro: { ru: 'ретро стиль 80-90х', en: 'retro style 80s-90s', uz: 'retro uslub 80-90-yillar' },
            fantasy: { ru: 'фэнтези, магический мир', en: 'fantasy, magical world', uz: 'fantaziya, sehrli dunyo' }
        };
        const promptLangInstruction = {
            ru: 'Отвечай ТОЛЬКО на РУССКОМ языке.',
            en: 'Answer ONLY in ENGLISH language.',
            uz: 'FAQAT O\'ZBEK tilida javob ber.'
        };
        return `Ты — генератор промтов. ${lengthDesc[length][promptLang]} Стиль: ${styleMap[style][promptLang]}. ${promptLangInstruction[promptLang]} Отвечай ТОЛЬКО промтом, без пояснений.`;
    }

    async function generatePrompt(userQuery, length, style, promptLang) {
        if (!userQuery.trim()) throw new Error(translations[selectedInterfaceLang].errorEmptyQuery);
        const systemPrompt = buildSystemPrompt(length, style, promptLang);
        const response = await fetch(GROQ_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
            body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: `Запрос: ${userQuery}` }
                ],
                temperature: 0.8,
                max_tokens: 600
            })
        });
        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || 'API error');
        }
        const data = await response.json();
        const prompt = data.choices?.[0]?.message?.content?.trim();
        if (!prompt) throw new Error('Failed');
        return prompt;
    }

    generateBtn.addEventListener('click', async () => {
        const query = userInput.value.trim();
        if (!query) {
            errorMsg.textContent = translations[selectedInterfaceLang].errorEmptyQuery;
            return;
        }
        errorMsg.textContent = '';
        resultCard.style.display = 'block';
        promptOutput.innerHTML = '<span class="loading"></span> Генерация...';
        generateBtn.disabled = true;
        try {
            const prompt = await generatePrompt(query, selectedLength, selectedStyle, selectedPromptLang);
            promptOutput.innerText = prompt;
            currentPrompt = prompt;
        } catch (err) {
            errorMsg.textContent = `❌ ${err.message}`;
            promptOutput.innerHTML = 'Ошибка';
        } finally {
            generateBtn.disabled = false;
        }
    });

    copyBtn.addEventListener('click', async () => {
        let text = promptOutput.innerText;
        if (!text || text.includes('Генерация') || text.includes('Ошибка')) {
            errorMsg.textContent = translations[selectedInterfaceLang].noPromptToCopy;
            setTimeout(() => errorMsg.textContent = '', 2000);
            return;
        }
        await navigator.clipboard.writeText(text);
        const original = copyBtn.innerText;
        copyBtn.innerText = translations[selectedInterfaceLang].copySuccess;
        setTimeout(() => copyBtn.innerText = original, 1500);
    });

    function saveToHistory(promptText, query) {
        history.unshift({ prompt: promptText, query, date: new Date().toLocaleString() });
        if (history.length > 50) history.pop();
        localStorage.setItem('vibe_prompts_history_v3', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        if (!historyList) return;
        if (history.length === 0) {
            historyList.innerHTML = `<div class="empty-history">${translations[selectedInterfaceLang].emptyHistory}</div>`;
            return;
        }
        historyList.innerHTML = history.map((item, idx) => `
            <div class="history-item" data-index="${idx}">
                <div class="history-prompt">${escapeHtml(item.prompt.substring(0, 150))}${item.prompt.length > 150 ? '...' : ''}</div>
                <div class="history-date">📅 ${item.date}</div>
            </div>
        `).join('');
        document.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index);
                if (!isNaN(idx) && history[idx]) {
                    promptOutput.innerText = history[idx].prompt;
                    currentPrompt = history[idx].prompt;
                    resultCard.style.display = 'block';
                }
            });
        });
    }

    function loadHistory() {
        const saved = localStorage.getItem('vibe_prompts_history_v3');
        if (saved) { try { history = JSON.parse(saved); } catch(e) {} }
        renderHistory();
    }

    saveBtn.addEventListener('click', () => {
        const prompt = promptOutput.innerText;
        if (!prompt || prompt.includes('Генерация') || prompt.includes('Ошибка')) {
            errorMsg.textContent = translations[selectedInterfaceLang].noPromptToSave;
            setTimeout(() => errorMsg.textContent = '', 2000);
            return;
        }
        saveToHistory(prompt, userInput.value.trim() || '—');
        errorMsg.textContent = translations[selectedInterfaceLang].saveSuccess;
        setTimeout(() => errorMsg.textContent = '', 2000);
    });

    clearHistoryBtn.addEventListener('click', () => {
        if (confirm(selectedInterfaceLang === 'ru' ? 'Удалить историю?' : 'Tarixni tozalash?')) {
            history = [];
            localStorage.removeItem('vibe_prompts_history_v3');
            renderHistory();
        }
    });

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    loadHistory();
    updateUILanguage();
</script>
</body>
</html>
