<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vibe Prompts — генератор промтов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f5f7 0%, #ffffff 100%);
            color: #1a1a2e;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding: 20px 16px;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        body.dark {
            background: linear-gradient(135deg, #0a0a0f 0%, #12121a 100%);
            color: #eef2ff;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title-section h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .title-section p {
            font-size: 0.75rem;
            margin-top: 4px;
            opacity: 0.7;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .lang-switch, .theme-switch {
            background: rgba(0, 0, 0, 0.08);
            border-radius: 40px;
            padding: 3px;
            display: flex;
            gap: 3px;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.dark .lang-switch, body.dark .theme-switch {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .lang-option, .theme-option {
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 32px;
            cursor: pointer;
            background: transparent;
            border: none;
            color: #666;
        }

        body.dark .lang-option, body.dark .theme-option {
            color: #9ca3af;
        }

        .lang-option.active, .theme-option.active {
            background: #7c3aed;
            color: white;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.4);
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        body.dark .card {
            background: rgba(30, 30, 40, 0.7);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .card-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: #8b8ca3;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            background: #f0f0f5;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 14px;
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
        }

        body.dark textarea {
            background: #1e1e2a;
            border-color: #2a2a35;
            color: #fff;
        }

        textarea:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        .option-group {
            width: 100%;
        }

        .option-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
            color: #a5b4fc;
            margin-bottom: 8px;
            display: block;
        }

        .option-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .opt-btn {
            background: #f0f0f5;
            border: 1px solid #ddd;
            border-radius: 40px;
            padding: 10px 16px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 0 auto;
            text-align: center;
        }

        body.dark .opt-btn {
            background: #1e1e2a;
            border-color: #2a2a35;
            color: #cbd5e1;
        }

        .opt-btn.active {
            background: #7c3aed;
            border-color: #7c3aed;
            color: white;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.4);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #f0f0f5;
            border: 1px solid #ddd;
            border-radius: 40px;
            padding: 10px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        body.dark .action-btn {
            background: #1e1e2a;
            border-color: #2a2a35;
            color: #cbd5e1;
        }

        .generate-btn {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border: none;
            border-radius: 44px;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: none;
        }

        body.dark .result-card {
            background: rgba(30, 30, 40, 0.7);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .result-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
            color: #8b8ca3;
        }

        .result-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.5);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #7c3aed;
            cursor: pointer;
        }

        body.dark .icon-btn {
            color: #c4b5fd;
        }

        .prompt-box {
            background: #f8f8fc;
            border-radius: 20px;
            padding: 16px;
            font-size: 0.9rem;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
            border-left: 3px solid #7c3aed;
        }

        body.dark .prompt-box {
            background: #0f0f17;
            color: #e2e8f0;
        }

        .history-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        body.dark .history-card {
            background: rgba(30, 30, 40, 0.7);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .history-item {
            background: #f8f8fc;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 2px solid #7c3aed;
            cursor: pointer;
        }

        body.dark .history-item {
            background: #0f0f17;
        }

        .error {
            color: #f87171;
            font-size: 0.75rem;
            margin-top: 10px;
            text-align: center;
        }

        .footer {
            text-align: center;
            font-size: 0.65rem;
            margin-top: 24px;
            opacity: 0.5;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(124, 58, 237, 0.2);
            border-radius: 50%;
            border-top-color: #7c3aed;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (min-width: 500px) {
            .options-grid {
                flex-direction: row;
                gap: 16px;
            }
            .option-group {
                flex: 1;
            }
            .opt-btn {
                padding: 8px 12px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title-section">
            <h1>Vibe Prompts</h1>
            <p id="subtitle">Напиши идею — получи идеальный промт</p>
        </div>
        <div class="header-controls">
            <div class="lang-switch">
                <button data-lang="ru" class="lang-option active">Рус</button>
                <button data-lang="uz" class="lang-option">Uz</button>
            </div>
            <div class="theme-switch">
                <button data-theme="light" class="theme-option active">☀️</button>
                <button data-theme="dark" class="theme-option">🌙</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title" id="inputLabel">✏️ Что генерируем?</div>
        <textarea id="userInput" rows="3" placeholder="Например: парень снимает mirror selfie в ванной, небрежный стиль..."></textarea>
    </div>

    <div class="action-buttons">
        <button id="exampleBtn" class="action-btn">📋 Пример</button>
        <button id="randomBtn" class="action-btn">🎲 Случайная идея</button>
    </div>

    <div class="options-grid">
        <div class="option-group">
            <div class="option-label" id="langPromptLabel">📝 Язык промта</div>
            <div class="option-buttons" id="promptLangOptions">
                <button data-plang="ru" class="opt-btn">Русский</button>
                <button data-plang="en" class="opt-btn active">English</button>
                <button data-plang="uz" class="opt-btn">O'zbekcha</button>
            </div>
        </div>
        <div class="option-group">
            <div class="option-label" id="lengthLabel">📏 Длина</div>
            <div class="option-buttons" id="lengthOptions">
                <button data-length="short" class="opt-btn">Короткий</button>
                <button data-length="detailed" class="opt-btn active">Подробный</button>
            </div>
        </div>
        <div class="option-group">
            <div class="option-label" id="styleLabel">🎨 Стиль</div>
            <div class="option-buttons" id="styleOptions">
                <button data-style="realistic" class="opt-btn">Реализм</button>
                <button data-style="anime" class="opt-btn">Аниме</button>
                <button data-style="cyberpunk" class="opt-btn">Киберпанк</button>
                <button data-style="retro" class="opt-btn">Ретро</button>
                <button data-style="fantasy" class="opt-btn">Фэнтези</button>
                <button data-style="lifestyle" class="opt-btn">📸 Lifestyle</button>
            </div>
        </div>
    </div>

    <button id="generateBtn" class="generate-btn">✨ Сгенерировать промт</button>

    <div id="resultCard" class="result-card">
        <div class="result-header">
            <span class="result-label" id="resultLabel">🎯 Промт</span>
            <div class="result-actions">
                <button id="copyBtn" class="icon-btn">📋 Копировать</button>
                <button id="saveBtn" class="icon-btn">⭐ Сохранить</button>
            </div>
        </div>
        <div id="promptOutput" class="prompt-box"></div>
        <div id="errorMsg" class="error"></div>
    </div>

    <div id="historyCard" class="history-card">
        <div class="history-title" style="display: flex; justify-content: space-between; margin-bottom: 16px;">
            <span class="card-title" id="historyLabel">📜 История</span>
            <button id="clearHistoryBtn" class="icon-btn" style="background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.5); color: #f87171;">🗑️ Очистить</button>
        </div>
        <div id="historyList" class="history-list"></div>
    </div>

    <div class="footer">
        🔥 Nano Banana 2, Midjourney, DALL·E, Stable Diffusion
    </div>
</div>

<script>
    const GROQ_API_KEY = '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';

        else document.body.classList.remove('dark');
        localStorage.setItem('theme', theme);
        document.querySelectorAll('.theme-option').forEach(btn => btn.classList.toggle('active', btn.dataset.theme === theme));
    }
    document.querySelectorAll('.theme-option').forEach(btn => btn.addEventListener('click', () => setTheme(btn.dataset.theme)));

            retro: { ru: 'ретро стиль 80-90х, винтажная эстетика, плёночное зерно, пастельные тона', en: 'retro style 80s-90s, vintage aesthetic, film grain, pastel tones', uz: 'retro uslub 80-90-yillar, vintage estetika, kino donasi, pastel ranglar' },
            fantasy: { ru: 'фэнтези, магический мир, древние леса, замки, волшебство, эпичная атмосфера', en: 'fantasy, magical world, ancient forests, castles, magic, epic atmosphere', uz: 'fantaziya, sehrli dunyo, qadimgi o\'rmonlar, qasrlar, sehr, epik atmosfera' },
            lifestyle: { ru: `кинематографичное реалистичное фото, lifestyle эстетика, уличная мода. Важно: указывай бренды (Pirelli, Calvin Klein, Nike, Jacquemus), конкретную одежду (материал, цвет, крой), аксессуары (цепочки, кольца, очки, браслеты), позу и угол съёмки (mirror selfie, overhead shot, low angle), тип освещения (мягкий тёплый свет, жёсткий флуоресцентный, естественный солнечный), окружение (ванная, бетонное кафе, улица Нью-Йорка), настроение (nonchalant, unbothered, introspective, intense), выражение лица (deadpan stare, soft pout, heavy-lidded eyes). Добавляй keywords: natural grain, cinematic, photorealistic, candid, raw aesthetic.`, en: `cinematic realistic photo, lifestyle aesthetic, streetwear. Include brands (Pirelli, Calvin Klein, Nike, Jacquemus), specific clothing (fabric, color, fit), accessories (chains, rings, glasses, bracelets), pose and camera angle (mirror selfie, overhead shot, low angle), lighting type (soft warm light, harsh fluorescent, natural daylight), environment (bathroom, concrete cafe, NYC street), mood (nonchalant, unbothered, introspective, intense), facial expression (deadpan stare, soft pout, heavy-lidded eyes). Add keywords: natural grain, cinematic, photorealistic, candid, raw aesthetic.`, uz: `kinematografik realistik surat, lifestyle estetikasi. Brendlarni (Pirelli, Calvin Klein, Nike, Jacquemus), kiyimni (mato, rang, kesim), aksessuarlarni (zanjirlar, uzuklar, ko'zoynaklar), poza va kamera burchagini (mirror selfie, yuqoridan pastga past burchak), yorug'lik turini (yumshoq iliq yorug'lik, qattiq floresan, tabiiy quyosh nuri), muhitni (hammom, beton kafe, NYC ko'chasi), kayfiyatni, yuz ifodasini ko'rsat. Keywords: natural grain, cinematic, photorealistic, candid, raw aesthetic.` }
        };
        
        const promptLangInstruction = {
            ru: 'Отвечай ТОЛЬКО на РУССКОМ языке. Пиши промт максимально подробно, как в примерах выше.',
            en: 'Answer ONLY in ENGLISH language. Write prompt in extreme detail like examples above - include specific brands, clothing details, accessories, lighting, pose, camera angle, environment, mood, facial expression. Add keywords: natural grain, cinematic, photorealistic, candid.',
            uz: 'FAQAT O\'ZBEK tilida javob ber. Yuqoridagi misollardagidek juda batafsil yozing - brendlar, kiyim tafsilotlari, aksessuarlar, yorug\'lik, poza, kamera burchagi, muhit, kayfiyat, yuz ifodasi. Keywords: natural grain, cinematic, photorealistic, candid.'
        };
        
        const fewShotExamples = `
Примеры качественных промтов (lifestyle/реалистичное фото):
1. "A young athletic male, early 20s, lean toned build, medium skin tone, short wet dark black hair slightly curly and damp. Wearing a white hydrogel sheet face mask - slightly loose and crinkled around chin and jaw. Completely shirtless. Thin silver chain necklace. Taking a mirror selfie, holding a black iPhone. Setting: moody dark bathroom with dark grey stone tile walls. Very dim ambient lighting - no harsh flash, soft moody shadows. Shot angle: slightly below eye level looking up. Candid, raw, unfiltered lifestyle aesthetic. Natural grain. Photorealistic."

2. "Two males on NYC sidewalk. Both holding iced coffee, looking directly at camera with deadpan, unbothered expressions. LEFT: tall, lean, dark brown skin, black Kangol bucket cap, clear square glasses, multiple gold chains, black oversized zip-up jacket, beige shorts, pink sneakers. RIGHT: medium skin, red snapback with white W logo, sheer ribbed cream long-sleeve top, grey leopard print wide-leg trousers, tan suede boots. Bright summer sunlight with dappled tree shade. Full body in frame. Street photography. Photorealistic."

3. "Extreme low-angle selfie pointing up at sky. Vivid blue sky, palm trees at corners. Young male wearing wide-brim cream bucket hat with frayed edges, 'JACQUEMUS' text, sporty wrap sunglasses with mirrored amber lenses, chunky shell necklace, cream mesh tank top. Direct gaze into camera. Harsh bright tropical sunlight, warm light on skin, slightly overexposed. Editorial lifestyle photography. Photorealistic."`;
        
        if (style === 'lifestyle') {
            return `Ты — профессиональный генератор промтов для нейросетей (Midjourney, DALL-E, Stable Diffusion, Nano Banana Pro).

${fewShotExamples}

${lengthDesc[length][promptLang]}

Стиль: ${styleMap[style][promptLang]}

${promptLangInstruction[promptLang]}

В промте обязательно указывай: пол, возраст, телосложение, цвет кожи, детали одежды (бренды, материал, цвет, крой), аксессуары (цепочки, кольца, очки, браслеты, часы), позу и угол съёмки, освещение, окружение, выражение лица, настроение. Добавляй keywords: natural grain, cinematic, photorealistic, candid, raw aesthetic.

Отвечай ТОЛЬКО промтом, без пояснений.`;
        }
        
        return `Ты — генератор промтов. ${lengthDesc[length][promptLang]} Стиль: ${styleMap[style][promptLang]}. ${promptLangInstruction[promptLang]} Отвечай ТОЛЬКО промтом, без пояснений.`;
    }

    async function generatePrompt(userQuery, length, style, promptLang) {
        if (!userQuery.trim()) throw new Error(translations[selectedInterfaceLang].errorEmptyQuery);
        const systemPrompt = buildSystemPrompt(length, style, promptLang);
        const response = await fetch(GROQ_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
            body: JSON.stringify({
                model: 'llama-3.3-70b-versatile',
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: `Запрос: ${userQuery}` }
                ],
                temperature: 0.85,
                max_tokens: 800
            })
        });
        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || 'API error');
        }
        const data = await response.json();
        const prompt = data.choices?.[0]?.message?.content?.trim();
        if (!prompt) throw new Error('Failed');
        return prompt;
    }

    generateBtn.addEventListener('click', async () => {
        const query = userInput.value.trim();
        if (!query) { errorMsg.textContent = translations[selectedInterfaceLang].errorEmptyQuery; return; }
        errorMsg.textContent = '';
        resultCard.style.display = 'block';
        promptOutput.innerHTML = '<span class="loading"></span> Генерация...';
        generateBtn.disabled = true;
        try {
            const prompt = await generatePrompt(query, selectedLength, selectedStyle, selectedPromptLang);
            promptOutput.innerText = prompt;
        } catch (err) {
            errorMsg.textContent = `❌ ${err.message}`;
            promptOutput.innerHTML = 'Ошибка';
        } finally {
            generateBtn.disabled = false;
        }
    });

    copyBtn.addEventListener('click', () => {
        let text = promptOutput.innerText || promptOutput.textContent;
        if (!text || text.includes('Генерация') || text.includes('Ошибка') || text.length < 5) {
            errorMsg.textContent = translations[selectedInterfaceLang].noPromptToCopy;
            setTimeout(() => errorMsg.textContent = '', 2000);
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                const original = copyBtn.innerText;
                copyBtn.innerText = translations[selectedInterfaceLang].copySuccess;
                setTimeout(() => copyBtn.innerText = original, 1500);
            }).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            const original = copyBtn.innerText;
            copyBtn.innerText = translations[selectedInterfaceLang].copySuccess;
            setTimeout(() => copyBtn.innerText = original, 1500);
        }
    });

    function saveToHistory(promptText, query) {
        history.unshift({ prompt: promptText, query, date: new Date().toLocaleString() });
        if (history.length > 50) history.pop();
        localStorage.setItem('vibe_prompts_history', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        if (!historyList) return;
        if (history.length === 0) { historyList.innerHTML = `<div style="text-align: center; color: #6b6b8a; padding: 20px;">${translations[selectedInterfaceLang].emptyHistory}</div>`; return; }
        historyList.innerHTML = history.map((item, idx) => `<div class="history-item" data-index="${idx}"><div style="color: inherit; word-break: break-word;">${escapeHtml(item.prompt.substring(0, 150))}${item.prompt.length > 150 ? '...' : ''}</div><div style="font-size: 0.65rem; color: #6b6b8a; margin-top: 6px;">📅 ${item.date}</div></div>`).join('');
        document.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index);
                if (!isNaN(idx) && history[idx]) { promptOutput.innerText = history[idx].prompt; resultCard.style.display = 'block'; }
            });
        });
    }

    function loadHistory() { const saved = localStorage.getItem('vibe_prompts_history'); if (saved) { try { history = JSON.parse(saved); } catch(e) {} } renderHistory(); }
    saveBtn.addEventListener('click', () => {
        const prompt = promptOutput.innerText;
        if (!prompt || prompt.includes('Генерация') || prompt.includes('Ошибка')) { errorMsg.textContent = translations[selectedInterfaceLang].noPromptToSave; setTimeout(() => errorMsg.textContent = '', 2000); return; }
        saveToHistory(prompt, userInput.value.trim() || '—');
        errorMsg.textContent = translations[selectedInterfaceLang].saveSuccess;
        setTimeout(() => errorMsg.textContent = '', 2000);
    });
    clearHistoryBtn.addEventListener('click', () => { if (confirm(selectedInterfaceLang === 'ru' ? 'Удалить историю?' : 'Tarixni tozalash?')) { history = []; localStorage.removeItem('vibe_prompts_history'); renderHistory(); } });
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
    loadHistory();
    updateUILanguage();
</script>
